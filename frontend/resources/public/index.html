<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JMC MCP Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.2.0/css/material-design-iconic-font.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply bg-slate-50 text-slate-900 antialiased;
        }
      }
      @layer components {
        .btn-primary {
          @apply bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium transition-all shadow-sm active:transform active:translate-y-0.5 cursor-pointer;
        }
        .btn-outline {
          @apply border border-slate-200 hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-md font-medium transition-all cursor-pointer;
        }
        .card {
          @apply bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden;
        }
      }
      /* Ensure re-com boxes don't break with Tailwind */
      .rc-v-box, .rc-h-box {
        display: flex !important;
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <noscript>
      JMC MCP Dashboard requires JavaScript. Please enable JavaScript to continue.
    </noscript>
    <div id="app"></div>
    <script src="/js/compiled/app.js"></script>
  </body>
</html>
